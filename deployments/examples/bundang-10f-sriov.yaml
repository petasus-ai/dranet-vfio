# Example DeviceClasses for a lab node with a ConnectX-6 Lx. The driver
# publishes every vfio-pci-bound network function with hardware-fact
# attributes; selection policy lives entirely in DeviceClass CEL. Every
# attribute read is guarded with `"attr" in ...` — reading an absent CEL
# attribute aborts the whole allocation.
#
# VFs selected by their parent PF's PCI address (stable across netdev
# renames; the per-node PCI difference is expressed as a cross-node union —
# allocation is per-node, so the union is safe).
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: vf-25.petasus.io
spec:
  selectors:
    - cel:
        expression: >-
          device.driver == "vfio.petasus.io" &&
          "kind" in device.attributes["vfio.petasus.io"] &&
          device.attributes["vfio.petasus.io"].kind == "vf" &&
          "linkType" in device.attributes["vfio.petasus.io"] &&
          device.attributes["vfio.petasus.io"].linkType == "ethernet" &&
          "pfPciAddress" in device.attributes["vfio.petasus.io"] &&
          device.attributes["vfio.petasus.io"].pfPciAddress in ["0000:86:00.1", "0001:01:00.1"]
---
# InfiniBand VFs, selected by link type and parent PF netdev name.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: ib-compute.petasus.io
spec:
  selectors:
    - cel:
        expression: >-
          device.driver == "vfio.petasus.io" &&
          "kind" in device.attributes["vfio.petasus.io"] &&
          device.attributes["vfio.petasus.io"].kind == "vf" &&
          "linkType" in device.attributes["vfio.petasus.io"] &&
          device.attributes["vfio.petasus.io"].linkType == "infiniband" &&
          "pfName" in device.attributes["vfio.petasus.io"] &&
          device.attributes["vfio.petasus.io"].pfName == "ibp12s0"
---
# Whole-PF passthrough, selected by the function's own PCI address.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: dpdk-uplink.petasus.io
spec:
  selectors:
    - cel:
        expression: >-
          device.driver == "vfio.petasus.io" &&
          "kind" in device.attributes["vfio.petasus.io"] &&
          device.attributes["vfio.petasus.io"].kind == "pf" &&
          "pciBusID" in device.attributes["resource.kubernetes.io"] &&
          device.attributes["resource.kubernetes.io"].pciBusID == "0000:51:00.1"
