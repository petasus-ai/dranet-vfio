name: Build and Push

on:
  push:
    # A sync/* branch builds a candidate image tagged with the branch slug, so
    # a rebase onto upstream can be rolled out before main moves.
    branches:
      - main
      - 'sync/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# The workflow only reads the repository; the registry push authenticates
# with its own credentials.
permissions:
  contents: read

# Runs of one ref finish in push order, so dev or a re-released tag never moves
# back to an older digest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: quay.io/edgestack/dranet-vfio

jobs:
  test:
    # Upstream's CI image; its kernel ships the vrf module the VRF tests use.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain of Dockerfile.petasus GOLANG_IMAGE.
          go-version: "1.27.3"

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^third_party/' || true)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # As upstream's CI: the pkg/driver tests build network namespaces inside
      # unprivileged user namespaces, which Ubuntu's AppArmor policy blocks.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        run: make test

  # One native runner per architecture: no QEMU, and the two builds run in
  # parallel. Each pushes an untagged image by digest; the manifest job joins
  # the digests into one tagged manifest list.
  build:
    if: github.event_name == 'push'
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Derive a filename-safe platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Quay.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: edgestack
          password: ${{ secrets.QUAY_CI_BOT_SECRET }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.petasus
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations would show up as unknown/unknown entries in the
          # manifest list.
          provenance: false
          sbom: false
          # Scoped per platform so the two runners do not overwrite each other.
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: REVISION=${{ github.sha }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Quay.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: edgestack
          password: ${{ secrets.QUAY_CI_BOT_SECRET }}

      # A version tag releases that tag (latest is the latest job's); a main push
      # publishes dev; a sync/* branch gets its slug (sync-upstream-<sha>).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/sync/') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create the manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      # Proof that every published tag carries exactly the two architectures.
      - name: Check the published manifest
        run: |
          set -euo pipefail
          for tag in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            got="$(docker buildx imagetools inspect "$tag" --raw \
              | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')"
            echo "$tag: $got"
            if [ "$got" != "linux/amd64 linux/arm64" ]; then
              echo "::error::$tag carries '$got', expected 'linux/amd64 linux/arm64'."
              exit 1
            fi
          done

  # latest follows the newest final release (vX.Y.Z, not an -rc), the rule the
  # other Petasus images follow. Runs of different tags overlap, so this job
  # runs in one repository-wide queue and points latest at the newest final
  # release as the tags stand when its turn comes; a pending run the queue
  # replaces loses nothing, as its replacement decides the same later.
  latest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-latest
      cancel-in-progress: false
    steps:
      - name: Checkout the tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find the newest final release
        id: newest
        run: |
          set -euo pipefail
          release='v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          newest="$(git tag -l 'v*' | { grep -Ex "$release" || true; } | sort -V | tail -n 1)"
          echo "newest final release: ${newest:-none}; this tag: ${GITHUB_REF_NAME}"
          echo "tag=$newest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.newest.outputs.tag != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Quay.io
        if: steps.newest.outputs.tag != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: edgestack
          password: ${{ secrets.QUAY_CI_BOT_SECRET }}

      # A newest release another run has not published yet is left to that run,
      # which moves latest once it has; any other registry error fails the job.
      - name: Point latest at the newest final release
        if: steps.newest.outputs.tag != ''
        env:
          NEWEST: ${{ steps.newest.outputs.tag }}
        run: |
          set -euo pipefail
          if ! err="$(docker buildx imagetools inspect "${IMAGE}:${NEWEST}" 2>&1 > /dev/null)"; then
            echo "$err" >&2
            if [ "$NEWEST" != "$GITHUB_REF_NAME" ] && grep -q 'not found' <<< "$err"; then
              echo "::warning::${IMAGE}:${NEWEST} is not published yet; its own run moves latest."
              exit 0
            fi
            exit 1
          fi
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${NEWEST}"
          got="$(docker buildx imagetools inspect "${IMAGE}:latest" --raw \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')"
          echo "${IMAGE}:latest = ${NEWEST}: $got"
          if [ "$got" != "linux/amd64 linux/arm64" ]; then
            echo "::error::${IMAGE}:latest carries '$got', expected 'linux/amd64 linux/arm64'."
            exit 1
          fi
